services:
  - type: web
    name: standupbot
    runtime: python
    buildCommand: pip install -r requirements.txt && python manage.py collectstatic --noinput
    startCommand: bash -c "python manage.py migrate && gunicorn standupbot.wsgi:application"
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: false
      - key: DATABASE_URL
        fromDatabase:
          name: standupbot-db
          property: connectionString

databases:
  - name: standupbot-db
    databaseName: standupbot
    user: standupbot