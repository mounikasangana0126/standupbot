{% extends 'base.html' %}
{% block title %}Login – StandupBot{% endblock %}

{% block content %}
<div style="max-width: 400px; margin: 5rem auto; padding: 0 1rem;">
  <div style="text-align: center; margin-bottom: 2rem;">
    <div style="font-size: 48px;">🚀</div>
    <h1 style="font-size: 22px; font-weight: 700;">StandupBot</h1>
    <p style="color: #718096; font-size: 14px; margin-top: 4px;">Daily async standups for your team</p>
  </div>

  <div class="card">
    <h2 style="font-size: 16px; font-weight: 600; margin-bottom: 1.1rem;">Sign in</h2>

    {% if form.errors %}
      <div class="alert" style="background: #fff5f5; color: #e53e3e; border: 1px solid #fed7d7; margin-bottom: 1rem;">
        Invalid username or password.
      </div>
    {% endif %}

    <form method="post">
      {% csrf_token %}
      <div class="form-group">
        <label for="id_username">Username</label>
        <input type="text" name="username" id="id_username" autofocus autocomplete="username">
      </div>
      <div class="form-group">
        <label for="id_password">Password</label>
        <input type="password" name="password" id="id_password" autocomplete="current-password">
      </div>
      <button type="submit" class="btn btn-primary" style="width: 100%; justify-content: center;">
        Sign in
      </button>
    </form>

    <p style="text-align: center; font-size: 13px; color: #718096; margin-top: 1rem;">
      No account? <a href="/register/" style="color: #4f46e5; text-decoration: none; font-weight: 500;">Register here</a>
    </p>
  </div>
</div>
{% endblock %}
